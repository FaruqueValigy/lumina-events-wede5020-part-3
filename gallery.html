<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Lumina Events</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="portfolio-page">

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">
            <h1>Lumina Events</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="gallery.html">Portfolio</a></li>
                <li><a href="booking.html">Plan Your Event</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    </header>

    <hr>

    <!-- ================= MAIN ================= -->

    <main>

        <section>

            <h2>Our Portfolio</h2>

            <figure>
                <button class="gallery-item" type="button" data-gallery-item="images/wedding.svg" data-gallery-title="Luxury Wedding">
                    <img src="images/wedding.svg" alt="Illustrated luxury wedding reception">
                </button>
                <figcaption>Luxury Wedding</figcaption>
            </figure>

            <figure>
                <button class="gallery-item" type="button" data-gallery-item="images/corporate.svg" data-gallery-title="Corporate Gala">
                    <img src="images/corporate.svg" alt="Illustrated corporate gala event">
                </button>
                <figcaption>Corporate Gala</figcaption>
            </figure>

            <figure>
                <button class="gallery-item" type="button" data-gallery-item="images/birthday.svg" data-gallery-title="Birthday Celebration">
                    <img src="images/birthday.svg" alt="Illustrated birthday celebration with balloons">
                </button>
                <figcaption>Birthday Celebration</figcaption>
            </figure>

        </section>

    </main>

    <div class="lightbox" id="gallery-lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" hidden>
        <div class="lightbox-content">
            <button class="lightbox-close" type="button" aria-label="Close image preview">&times;</button>
            <img id="lightbox-image" src="" alt="">
            <p class="lightbox-title" id="lightbox-title"></p>
        </div>
    </div>

    <hr>

    <!-- ================= FOOTER ================= -->

    <footer>
        <p>&copy; 2026 Lumina Events. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
